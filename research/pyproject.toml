[project]
name = "skim-arbitrage-analysis"
version = "0.1.0"
description = "Simulation and analysis of skim-based performance fee arbitrage opportunities"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
