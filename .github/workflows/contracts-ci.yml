name: "Smart Contracts CI"

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-vnet-counter
  cancel-in-progress: false

env:
  OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
  FLARE_RPC_URL: ${{ secrets.FLARE_RPC_URL }}
  ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
  HYPEREVM_RPC_URL: ${{ secrets.HYPEREVM_RPC_URL || 'https://rpc.hyperliquid.xyz/evm' }}
  BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
  TENDERLY_ACCESS_KEY: ${{ secrets.TENDERLY_ACCESS_KEY }}
  TENDERLY_PROJECT_SLUG: "v2"
  TENDERLY_ACCOUNT_ID: "superform"
  FOUNDRY_EXPORTS_OVERWRITE_LATEST: "true"
  ONE_INCH_API_KEY: ${{ secrets.ONE_INCH_API_KEY }}
  ODOS_API_KEY: ${{ secrets.ODOS_API_KEY }}
  # Optional: open-api-pro.openocean.finance is key-gated. Without this the OpenOcean swap
  # test skips cleanly instead of running unauthenticated against a paid endpoint.
  OPENOCEAN_API_KEY: ${{ secrets.OPENOCEAN_API_KEY }}
  CI: "true"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - "feat/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
jobs:
  build:
    # Named runner, matching v2-core's contracts-ci.yml. The previous label set
    # [self-hosted, Linux, ARM64, arm, us-east-1, ci-v3] stopped being claimed by any runner:
    # every run from 2026-11-04 onwards sat queued, on feature branches and on dev alike, with
    # the last run to actually execute on 2026-10-24. v2-core has been green on SuperformCore3
    # throughout, so this points at the pool that is demonstrably alive.
    runs-on: "SuperformCore3"
    steps:
      - name: Mask Secrets
        run: |
          echo "::add-mask::${{ secrets.AWS_ROLE_ARN }}"
          echo "::add-mask::${{ secrets.S3_BUCKET_NAME }}"
          echo "::add-mask::${{ secrets.AWS_REGION }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: "Check out the repo"
        uses: "actions/checkout@v4"

      - name: "Install node"
        uses: "actions/setup-node@v3"
        with:
          # Pinned, matching v2-core. "latest" resolved to node 27.0.0-alpha on the runner.
          node-version: "22.23.4"

      - name: "Install yarn"
        run: npm install -g yarn

      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@v1"
        with:
          version: "v1.3.6"

      - name: "Get forge version"
        run: forge --version

      - name: Print ulimits
        run: ulimit -Sa && ulimit -Ha

      - name: "Clean yarn cache"
        run: rm -rf "$(yarn cache dir)"

      - name: Install Dependencies
        run: yarn install --ignore-scripts

      - name: "Install Foundry dependencies"
        run: forge install

      - name: "Install pnpm"
        # 9.x is required: modulekit's pnpm-lock.yaml is lockfileVersion 9.0, and pnpm 8
        # silently ignores it and re-resolves every dependency from scratch.
        run: npm install -g pnpm@9.15.9

      - name: "Check pnpm version"
        run: pnpm --version

      - name: "Install ModuleKit"
        working-directory: ./lib/v2-core/lib/modulekit
        # --frozen-lockfile keeps the pinned resolutions. Re-resolving turns the
        # `github:vectorized/solady` specifier into git+ssh://git@github.com/..., which fails
        # on a runner with no SSH key; the lockfile already pins the https codeload tarball.
        run: pnpm install --frozen-lockfile

      - name: "Install Nexus"
        working-directory: ./lib/v2-core/lib/nexus
        # nexus declares packageManager yarn@1.22.22 and ships only yarn.lock, so yarn is
        # correct here; --frozen-lockfile keeps it from re-resolving.
        run: yarn --frozen-lockfile

      - name: "Install Safe7579"
        working-directory: ./lib/v2-core/lib/safe7579
        # safe7579 ships a pnpm-lock.yaml (lockfileVersion 9.0) and v2-core installs it with
        # pnpm. `yarn` ignores that lockfile and re-resolves the whole tree from the registry,
        # which is what produced the 504 Gateway Timeout here.
        run: pnpm install --frozen-lockfile

      - name: "Build the contracts and print their size"
        run: "FOUNDRY_PROFILE=ci-sizes forge build --sizes"

      - name: "Add build summary"
        run: |
          echo "## Build result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

  test:
    needs: ["build"]
    runs-on: "SuperformCore3"
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v4"

      - name: "Install node"
        uses: "actions/setup-node@v3"
        with:
          # Pinned, matching v2-core. "latest" resolved to node 27.0.0-alpha on the runner.
          node-version: "22.23.4"

      - name: "Install yarn"
        run: npm install -g yarn

      - name: "Clean yarn cache"
        run: rm -rf "$(yarn cache dir)"

      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@v1"
        with:
          version: "v1.3.6"

      - name: "Install Foundry dependencies"
        run: forge install

      - name: "Install pnpm"
        # 9.x is required: modulekit's pnpm-lock.yaml is lockfileVersion 9.0, and pnpm 8
        # silently ignores it and re-resolves every dependency from scratch.
        run: npm install -g pnpm@9.15.9

      - name: "Install ModuleKit"
        working-directory: ./lib/v2-core/lib/modulekit
        # --frozen-lockfile keeps the pinned resolutions. Re-resolving turns the
        # `github:vectorized/solady` specifier into git+ssh://git@github.com/..., which fails
        # on a runner with no SSH key; the lockfile already pins the https codeload tarball.
        run: pnpm install --frozen-lockfile

      - name: "Install Nexus"
        working-directory: ./lib/v2-core/lib/nexus
        # nexus declares packageManager yarn@1.22.22 and ships only yarn.lock, so yarn is
        # correct here; --frozen-lockfile keeps it from re-resolving.
        run: yarn --frozen-lockfile

      - name: "Install Safe7579"
        working-directory: ./lib/v2-core/lib/safe7579
        # safe7579 ships a pnpm-lock.yaml (lockfileVersion 9.0) and v2-core installs it with
        # pnpm. `yarn` ignores that lockfile and re-resolves the whole tree from the registry,
        # which is what produced the 504 Gateway Timeout here.
        run: pnpm install --frozen-lockfile

      - name: "Install merkle-js dependencies"
        working-directory: ./test/utils/merkle/merkle-js
        run: npm install

      - name: "Show the Foundry config"
        run: "forge config"

      - name: "Generate a fuzz seed that changes weekly to avoid burning through RPC allowance"
        run: >
          echo "FOUNDRY_FUZZ_SEED=$(
            echo $(($EPOCHSECONDS - $EPOCHSECONDS % 604800))
          )" >> $GITHUB_ENV

      # The `test` job runs on a self-hosted runner, so ~/.foundry/cache/rpc persists between
      # runs (unlike a GitHub-hosted runner, which always starts clean). A stale entry there
      # silently feeds tests different fork state than a fresh checkout would, which makes CI
      # results untrustworthy and locally unreproducible. Drop it before each run.
      - name: "Clear the persistent fork cache"
        run: "forge cache clean || true"

      - name: "Run the tests"
        run: "make ftest-ci"

      # [profile.ci] sets verbosity=4 but nothing selects that profile, so the run above reports
      # failures with no trace. Re-run just the suites that failed with traces so a CI-only
      # failure is diagnosable without another push.
      - name: "Re-run failures with traces"
        if: failure()
        run: "forge test --match-path 'test/integration/SuperVault/SuperVault.Pendle.t.sol' -vvvv || true"

      - name: "Add test summary"
        run: |
          echo "## Tests result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

  smoke-test:
    needs: ["build"]
    runs-on: "SuperformCore3"
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v4"

      - name: "Install node"
        uses: "actions/setup-node@v3"
        with:
          # Pinned, matching v2-core. "latest" resolved to node 27.0.0-alpha on the runner.
          node-version: "22.23.4"

      - name: "Install yarn"
        run: npm install -g yarn

      - name: "Clean yarn cache"
        run: rm -rf "$(yarn cache dir)"

      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@v1"
        with:
          version: "v1.3.6"

      - name: "Install Foundry dependencies"
        run: forge install

      - name: "Install pnpm"
        # 9.x is required: modulekit's pnpm-lock.yaml is lockfileVersion 9.0, and pnpm 8
        # silently ignores it and re-resolves every dependency from scratch.
        run: npm install -g pnpm@9.15.9

      - name: "Install ModuleKit"
        working-directory: ./lib/v2-core/lib/modulekit
        # --frozen-lockfile keeps the pinned resolutions. Re-resolving turns the
        # `github:vectorized/solady` specifier into git+ssh://git@github.com/..., which fails
        # on a runner with no SSH key; the lockfile already pins the https codeload tarball.
        run: pnpm install --frozen-lockfile

      - name: "Install Nexus"
        working-directory: ./lib/v2-core/lib/nexus
        # nexus declares packageManager yarn@1.22.22 and ships only yarn.lock, so yarn is
        # correct here; --frozen-lockfile keeps it from re-resolving.
        run: yarn --frozen-lockfile

      - name: "Install Safe7579"
        working-directory: ./lib/v2-core/lib/safe7579
        # safe7579 ships a pnpm-lock.yaml (lockfileVersion 9.0) and v2-core installs it with
        # pnpm. `yarn` ignores that lockfile and re-resolves the whole tree from the registry,
        # which is what produced the 504 Gateway Timeout here.
        run: pnpm install --frozen-lockfile

      - name: "Run smoke tests"
        run: |
          chmod +x ./script/run/smoke_test_v2_periphery.sh
          ./script/run/smoke_test_v2_periphery.sh prod

      - name: "Add smoke test summary"
        run: |
          echo "## Smoke Tests result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

  vnet-deploy:
    needs: ["test"]
    if:
      github.event_name == 'workflow_dispatch'
    runs-on: "SuperformCore3"
    outputs:
      eth_mainnet_addresses: ${{ steps.get-addresses-eth.outputs.addresses }}
      base_mainnet_addresses: ${{ steps.get-addresses-base.outputs.addresses }}
      optimism_mainnet_addresses: ${{ steps.get-addresses-optimism.outputs.addresses }}
    steps:
      # -------------------------------------------------------------------
      # Block for OIDC
      # -------------------------------------------------------------------
      - name: Mask Secrets
        run: |
          echo "::add-mask::${{ secrets.AWS_ROLE_ARN }}"
          echo "::add-mask::${{ secrets.S3_BUCKET_NAME }}"
          echo "::add-mask::${{ secrets.AWS_REGION }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      # -------------------------------------------------------------------

      - name: "Check out the repo"
        uses: "actions/checkout@v4"

      - name: "Install node"
        uses: "actions/setup-node@v3"
        with:
          # Pinned, matching v2-core. "latest" resolved to node 27.0.0-alpha on the runner.
          node-version: "22.23.4"

      - name: "Install yarn"
        run: npm install -g yarn

      - name: "Clean yarn cache"
        run: rm -rf "$(yarn cache dir)"

      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@v1"
        with:
          version: "v1.3.6"

      - name: "Install Foundry dependencies"
        run: forge install

      - name: "Install pnpm"
        # 9.x is required: modulekit's pnpm-lock.yaml is lockfileVersion 9.0, and pnpm 8
        # silently ignores it and re-resolves every dependency from scratch.
        run: npm install -g pnpm@9.15.9

      - name: "Install ModuleKit"
        working-directory: ./lib/v2-core/lib/modulekit
        # --frozen-lockfile keeps the pinned resolutions. Re-resolving turns the
        # `github:vectorized/solady` specifier into git+ssh://git@github.com/..., which fails
        # on a runner with no SSH key; the lockfile already pins the https codeload tarball.
        run: pnpm install --frozen-lockfile

      - name: "Install Nexus"
        working-directory: ./lib/v2-core/lib/nexus
        # nexus declares packageManager yarn@1.22.22 and ships only yarn.lock, so yarn is
        # correct here; --frozen-lockfile keeps it from re-resolving.
        run: yarn --frozen-lockfile

      - name: "Install Safe7579"
        working-directory: ./lib/v2-core/lib/safe7579
        # safe7579 ships a pnpm-lock.yaml (lockfileVersion 9.0) and v2-core installs it with
        # pnpm. `yarn` ignores that lockfile and re-resolves the whole tree from the registry,
        # which is what produced the 504 Gateway Timeout here.
        run: pnpm install --frozen-lockfile

      - name: "Install Tenderly CLI"
        run: curl https://raw.githubusercontent.com/Tenderly/tenderly-cli/master/scripts/install-linux.sh | sudo sh

      - name: "Install jq"
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: "Make deploy script executable"
        run: chmod +x ./script/run/deploy_v2_vnet_s3.sh

      - name: Get branch name and commit hash
        id: branch-info
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: "Run deploy script"
        run: ./script/run/deploy_v2_vnet_s3.sh "$BRANCH_NAME"
        env:
          TENDERLY_ACCESS_KEY: ${{ secrets.TENDERLY_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Get deployed addresses for Ethereum
        id: get-addresses-eth
        run: |
          ADDRESSES=$(cat ./script/output/1/Ethereum-latest.json | jq -c .)
          echo "addresses=$ADDRESSES" >> $GITHUB_OUTPUT

      - name: Get deployed addresses for Base
        id: get-addresses-base
        run: |
          ADDRESSES=$(cat ./script/output/8453/Base-latest.json | jq -c .)
          echo "addresses=$ADDRESSES" >> $GITHUB_OUTPUT

      - name: Get deployed addresses for Optimism
        id: get-addresses-optimism
        run: |
          ADDRESSES=$(cat ./script/output/10/Optimism-latest.json | jq -c .)
          echo "addresses=$ADDRESSES" >> $GITHUB_OUTPUT

      - name: Add deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Ethereum Mainnet (Chain ID: 1)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat ./script/output/1/Ethereum-latest.json | jq . >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "### Base (Chain ID: 8453)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat ./script/output/8453/Base-latest.json | jq . >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "### Optimism (Chain ID: 10)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat ./script/output/10/Optimism-latest.json | jq . >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

